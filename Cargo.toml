[package]
name = "termdown"
version = "0.2.0"
edition = "2024"

[dependencies]
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
comrak = { version = "0.54.0", default-features = false }
unicode-width = "0.2"
clap = { version = "4.5", features = ["derive"] }
color-eyre = "0.6"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
