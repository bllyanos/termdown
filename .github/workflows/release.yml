name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Linux release
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Build release binary
        run: cargo +stable build --locked --release

      - name: Package release assets
        run: |
          mkdir -p dist/termdown
          cp target/release/termdown dist/termdown/
          cp README.md LICENSE dist/termdown/
          tar -C dist -czf dist/termdown-linux-x86_64.tar.gz termdown
          (cd dist && sha256sum termdown-linux-x86_64.tar.gz) > dist/termdown-linux-x86_64.tar.gz.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "termdown $GITHUB_REF_NAME" \
            --generate-notes \
            dist/termdown-linux-x86_64.tar.gz \
            dist/termdown-linux-x86_64.tar.gz.sha256
